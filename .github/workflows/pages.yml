# Publishes the dashboard to GitHub Pages whenever main changes.
name: Publish dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      # Browsers keep app.js for a while. A page from one publish running a
      # script from another breaks on its first missing button, so each
      # publish asks for its own app.js by this commit's id.
      - name: Tie index.html to this publish's app.js
        run: |
          sed -i "s|<script src=\"app.js\"></script>|<script src=\"app.js?v=${GITHUB_SHA::8}\"></script>|" index.html
          grep -q "app.js?v=${GITHUB_SHA::8}" index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
